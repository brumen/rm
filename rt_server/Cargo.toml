[package]
name = "rt_server"
version = "0.1.0"
edition = "2021"

# [lib]
# path = "src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints.clippy]
recursive_call = "allow"

[lints.cargo]
# Keep the existing rt_server executable name for compatibility.
non_kebab_case_bins = "allow"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.73"
axum = "0.8.8"
chrono = { version = "0.4.42", features = ["serde"] }
dashmap = { version = "6.1.0", features = ["arbitrary", "rayon", "serde"] }
dotenv = "0.15.0"
futures = { version = "0.3.28", features = ["futures-executor", "thread-pool"] }
futures-channel = "0.3.28"
kafka = "0.9.0"
lazy_static = "1.5.0"
local-ip-address = "0.6.10"
log = "0.4.18"
ractor = { version = "0.15.9", features = ["async-trait", "message_span_propogation"] }
rdkafka = "0.36.2"
reqwest = { version = "0.11.13", features = ["blocking", "json"] }
scc = "3.5.5"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.91"
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "1.0.40"
tokio = { version = "1.24.2", features = ["full", "macros", "rt", "rt-multi-thread", "tracing", "net"] }
tracing = { version = "0.1.37", features = ["log"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.3.4", features = ["v4"] }
